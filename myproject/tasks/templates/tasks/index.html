<!DOCTYPE html>
<html>
<head>
    <title>Task Manager</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 400px;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        form {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            outline: none;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #5a67d8;
        }

        ul {
            list-style: none;
            padding: 0;
            margin-top: 20px;
        }

        li {
            background: #f3f3f3;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .task-text {
            flex: 1;
        }

        .completed {
            text-decoration: line-through;
            color: gray;
        }

        .actions a {
            margin-left: 10px;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
        }

        .complete {
            color: green;
        }

        .edit {
            color: #555;
        }

        .delete {
            color: red;
        }

        .empty {
            text-align: center;
            color: gray;
        }
    </style>
</head>

<body>

<div class="container">
    <h1> Task Manager</h1>

    <form method="POST">
        {% csrf_token %}
        <input type="text" name="title" placeholder="Enter task" required>
        <button type="submit">Add</button>
    </form>

    <ul>
        {% for task in tasks %}
            <li>
                <span class="task-text {% if task.completed %}completed{% endif %}">
                    {{ task.title }}
                </span>

                <div class="actions">
                    <a href="/complete/{{ task.id }}/" class="complete">✔</a>
                    <a href="/edit/{{ task.id }}/" class="edit">✏️</a>
                    <a href="/delete/{{ task.id }}/" class="delete">❌</a>
                </div>
            </li>
        {% empty %}
            <li class="empty">No tasks yet</li>
        {% endfor %}
    </ul>
</div>

</body>
</html>
